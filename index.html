    will-change: transform;
  }

  @keyframes photoDrift{
    0%{ transform: scale(1.06) translate(0,0); }
    100%{ transform: scale(1.16) translate(-1.4%, -1%); }
  }

  .bg-gradient{
    position:fixed; inset:0; z-index:1;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(30,123,255,0.22), transparent 55%),
      radial-gradient(ellipse at 80% 75%, rgba(79,195,255,0.14), transparent 55%),
      linear-gradient(160deg, rgba(6,22,47,0.65) 0%, rgba(10,35,77,0.4) 45%, rgba(6,22,47,0.7) 100%);
    background-size:220% 220%, 220% 220%, 200% 200%;
    animation: gradientDrift 22s ease-in-out infinite alternate;
  }

  @keyframes gradientDrift{
    0%{ background-position: 0% 30%, 100% 70%, 0% 50%; }
    50%{ background-position: 40% 60%, 60% 30%, 50% 50%; }
    100%{ background-position: 80% 20%, 20% 90%, 100% 50%; }
  }

  .aurora{
    position:fixed; inset:-10%; z-index:2; pointer-events:none;
    filter: blur(70px);
    opacity:0.55;
    mix-blend-mode: screen;
  }
  .aurora span{
    position:absolute;
    border-radius:50%;
    opacity:0.55;
  }
  .aurora span:nth-child(1){
    width:46vw; height:46vw; top:-10%; left:-8%;
    background: radial-gradient(circle, var(--blue), transparent 70%);
    animation: floatBlob1 26s ease-in-out infinite;
  }
  .aurora span:nth-child(2){
    width:38vw; height:38vw; bottom:-12%; right:-6%;
    background: radial-gradient(circle, var(--cyan), transparent 70%);
    animation: floatBlob2 30s ease-in-out infinite;
  }
  .aurora span:nth-child(3){
    width:30vw; height:30vw; top:35%; left:60%;
    background: radial-gradient(circle, var(--navy-mid), transparent 70%);
    animation: floatBlob3 34s ease-in-out infinite;
  }

  @keyframes floatBlob1{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(8vw, 6vh) scale(1.15); }
  }
  @keyframes floatBlob2{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-6vw, -8vh) scale(1.2); }
  }
  @keyframes floatBlob3{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-5vw, 4vh) scale(0.9); }
  }

  /* Signature element: crossing light blades echoing the logo's X silhouette */
  .blades{
    position:fixed; inset:0; z-index:3; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .blade{
    position:absolute;
    width:2px;
    height:150vmax;
    top:50%; left:50%;
    background: linear-gradient(to bottom, transparent 0%, rgba(79,195,255,0.5) 45%, rgba(30,123,255,0.6) 50%, rgba(79,195,255,0.5) 55%, transparent 100%);
    filter: blur(3px);
    opacity:0.35;
    transform-origin:center;
  }
  .blade.b1{ transform: translate(-50%,-50%) rotate(45deg); animation: bladeRotate1 40s ease-in-out infinite; }
  .blade.b2{ transform: translate(-50%,-50%) rotate(-45deg); animation: bladeRotate2 46s ease-in-out infinite; }

  @keyframes bladeRotate1{
    0%,100%{ transform: translate(-50%,-50%) rotate(43deg); opacity:0.28; }
    50%{ transform: translate(-50%,-50%) rotate(47deg); opacity:0.45; }
  }
  @keyframes bladeRotate2{
    0%,100%{ transform: translate(-50%,-50%) rotate(-43deg); opacity:0.28; }
    50%{ transform: translate(-50%,-50%) rotate(-47deg); opacity:0.45; }
  }

  canvas#bgParticles{
    position:fixed; inset:0; z-index:4; pointer-events:none;
  }

  .vignette{
    position:fixed; inset:0; z-index:5; pointer-events:none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(2,8,20,0.55) 100%);
  }

  /* ---------- MAIN CONTENT ---------- */

  main{
    position:relative; z-index:10;
    height:100vh; width:100vw;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    padding: 4vh 6vw;
  }

  .logo-wrap{
    transition: transform 0.35s ease;
  }

  .logo{
    width: min(46vw, 420px);
    min-width:180px;
    display:block;
    filter: drop-shadow(0 0 18px rgba(79,195,255,0.35)) drop-shadow(0 0 42px rgba(30,123,255,0.25));
    animation: logoFloat 6s ease-in-out infinite, logoFadeIn 1.4s ease both, logoGlow 4.5s ease-in-out infinite;
    transition: transform 0.5s ease, filter 0.5s ease;
  }
  .logo-wrap:hover .logo{
    transform: rotate(-2deg) scale(1.03);
    filter: drop-shadow(0 0 26px rgba(79,195,255,0.55)) drop-shadow(0 0 60px rgba(30,123,255,0.4));
  }

  @keyframes logoFadeIn{
    from{ opacity:0; transform: translateY(-24px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @keyframes logoFloat{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-14px); }
  }
  @keyframes logoGlow{
    0%,100%{ filter: drop-shadow(0 0 18px rgba(79,195,255,0.30)) drop-shadow(0 0 42px rgba(30,123,255,0.22)); }
    50%{ filter: drop-shadow(0 0 30px rgba(79,195,255,0.55)) drop-shadow(0 0 66px rgba(30,123,255,0.38)); }
  }

  .title-wrap{
    margin-top: clamp(0.5rem, 2vh, 1.8rem);
    transition: transform 0.35s ease;
  }

  h1{
    position:relative;
    font-family:'Anton', sans-serif;
    font-weight:400;
    text-transform:uppercase;
    font-size: clamp(2.6rem, 10vw, 8.5rem);
    letter-spacing: 0.05em;
    line-height:0.95;
    background-image:
      linear-gradient(115deg,
        #b9c9de 0%, #eef4fb 8%, #7e93b0 22%, #5a6f8c 32%,
        #dbe6f3 42%, #f5f9fd 50%, #93a8c4 60%, #667c9a 70%,
        #cddaeb 82%, #f0f5fb 92%, #7e93b0 100%);
    background-size: 260% 100%;
    background-position: 0% 50%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    opacity:0;
    animation: titleFadeUp 1.2s 0.5s cubic-bezier(.2,.7,.2,1) both,
               titleFloat 7s 1.8s ease-in-out infinite,
               chromeShift 9s 1.8s ease-in-out infinite;
    transition: transform 0.4s ease;
  }
  .title-wrap:hover h1{
    transform: scale(1.035);
  }

  h1::before,
  h1::after{
    content: attr(data-text);
    position:absolute;
    inset:0;
    pointer-events:none;
  }

  /* moving specular shine sweeping across the letters, like brushed chrome */
  h1::before{
    background-image: linear-gradient(120deg,
      transparent 35%, rgba(210,228,250,0.4) 47%, rgba(210,228,250,0.4) 53%, transparent 65%);
    background-size: 250% 250%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    mix-blend-mode: overlay;
    animation: shineSweep 8s ease-in-out infinite;
  }

  /* fine metallic grain */
  h1::after{
    background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxODAiIGhlaWdodD0iMTgwIj4KPGZpbHRlciBpZD0ibiI+PGZlVHVyYnVsZW5jZSB0eXBlPSJmcmFjdGFsTm9pc2UiIGJhc2VGcmVxdWVuY3k9IjEuMTUiIG51bU9jdGF2ZXM9IjMiIHN0aXRjaFRpbGVzPSJzdGl0Y2giIHJlc3VsdD0idCIvPjxmZUNvbG9yTWF0cml4IGluPSJ0IiB0eXBlPSJtYXRyaXgiIHZhbHVlcz0iMCAwIDAgMCAxICAwIDAgMCAwIDEgIDAgMCAwIDAgMSAgMCAwIDAgMS42IC0wLjM1Ii8+PC9maWx0ZXI+CjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNuKSIvPgo8L3N2Zz4=");
    background-size: 110px 110px;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    mix-blend-mode: overlay;
    opacity:0.85;
  }

  @keyframes chromeShift{
    0%,100%{ background-position: 0% 50%; }
    50%{ background-position: 100% 50%; }
  }

  @keyframes shineSweep{
    0%{ background-position: -60% -20%; }
    50%{ background-position: 160% 120%; }
    100%{ background-position: -60% -20%; }
  }

  @keyframes titleFadeUp{
    from{ opacity:0; transform: translateY(40px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @keyframes titleFloat{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-8px); }
  }
  .subtitle{
    margin-top: clamp(0.8rem, 2.2vh, 1.6rem);
    font-family:'Chakra Petch', sans-serif;
    font-weight:400;
    font-size: clamp(0.85rem, 1.6vw, 1.15rem);
    letter-spacing: 0.22em;
    text-transform:uppercase;
    color: rgba(210,230,255,0.78);
    opacity:0;
    animation: subFade 1.4s 1.4s ease both;
  }

  @keyframes subFade{
    from{ opacity:0; transform: translateY(16px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* ---------- FOOTER ---------- */

  footer{
    position:fixed; bottom: clamp(1.2rem, 3vh, 2.4rem); left:0; right:0;
    z-index:20;
    display:flex; flex-direction:column; align-items:center; gap:0.5rem;
    padding: 0 4vw;
    opacity:0;
    animation: footerFade 1.6s 2s ease both;
  }

  .sponsors{
    font-family:'Chakra Petch', sans-serif;
    font-weight:300;
    font-size: clamp(0.55rem, 1.3vw, 0.72rem);
    letter-spacing: 0.18em;
    text-transform:uppercase;
    color: rgba(255,255,255,0.7);
    text-align:center;
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap: 0.6em;
  }
  .sponsors .dot{
    width:3px; height:3px; border-radius:50%;
    background: rgba(255,255,255,0.4);
    display:inline-block;
  }

  .copyright{
    font-family:'Chakra Petch', sans-serif;
    font-weight:300;
    font-size: clamp(0.6rem, 1.2vw, 0.7rem);
    letter-spacing:0.12em;
    color: rgba(255,255,255,0.45);
  }

  @keyframes footerFade{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* ---------- CUSTOM CURSOR ---------- */

  canvas#trailCanvas{
    position:fixed; inset:0; z-index:9998; pointer-events:none;
    mix-blend-mode: screen;
  }

  #cursorOrb{
    position:fixed;
    top:0; left:0;
    width:16px; height:16px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(79,195,255,0.85) 35%, rgba(30,123,255,0.35) 65%, transparent 75%);
    box-shadow: 0 0 18px 4px rgba(79,195,255,0.55), 0 0 36px 10px rgba(30,123,255,0.25);
    z-index:9999;
    pointer-events:none;
    will-change: transform;
    transition: width 0.25s ease, height 0.25s ease, opacity 0.25s ease;
  }
  #cursorOrb.cursor-grow{
    width:44px; height:44px;
    box-shadow: 0 0 26px 8px rgba(79,195,255,0.6), 0 0 54px 16px rgba(30,123,255,0.3);
  }

  @media (hover: none), (pointer: coarse){
    #cursorOrb, canvas#trailCanvas{ display:none; }
  }

  /* ---------- RESPONSIVE ---------- */

  @media (max-width: 640px){
    .logo{ width: min(62vw, 300px); }
    .subtitle{ letter-spacing: 0.14em; }
    .sponsors{ gap:0.4em; }
  }

  @media (max-height: 560px){
    .logo{ width: min(30vw, 220px); }
    h1{ font-size: clamp(2rem, 8vw, 5rem); }
    footer{ bottom: 0.8rem; }
  }

  /* ---------- REDUCED MOTION ---------- */

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
    .logo, h1, .subtitle, footer{ opacity:1; }
    body.custom-cursor, body.custom-cursor *{ cursor:auto; }
    #cursorOrb, canvas#trailCanvas{ display:none; }
  }
</style>

(function(){
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isTouch = window.matchMedia('(hover: none), (pointer: coarse)').matches;

  /* ---------- Background particles ---------- */
  const bgCanvas = document.getElementById('bgParticles');
  const bctx = bgCanvas.getContext('2d');
  let bw, bh;
  function resizeBg(){
    bw = bgCanvas.width = window.innerWidth;
    bh = bgCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeBg);
  resizeBg();

  const count = window.innerWidth < 700 ? 26 : 55;
  const particles = Array.from({length: count}, () => ({
    x: Math.random() * bw,
    y: Math.random() * bh,
    r: Math.random() * 1.6 + 0.4,
    speed: Math.random() * 0.28 + 0.05,
    drift: (Math.random() - 0.5) * 0.15,
    alpha: Math.random() * 0.45 + 0.12
  }));

  function drawParticles(){
    bctx.clearRect(0, 0, bw, bh);
    for(const p of particles){
      p.y -= p.speed;
      p.x += p.drift;
      if(p.y < -10){ p.y = bh + 10; p.x = Math.random() * bw; }
      if(p.x < -10) p.x = bw + 10;
      if(p.x > bw + 10) p.x = -10;
      bctx.beginPath();
      bctx.fillStyle = `rgba(170,215,255,${p.alpha})`;
      bctx.shadowColor = 'rgba(79,195,255,0.8)';
      bctx.shadowBlur = 4;
      bctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      bctx.fill();
    }
    if(!reduceMotion) requestAnimationFrame(drawParticles);
  }
  drawParticles();

  if(isTouch) return; /* skip cursor & magnetic effects on touch devices */

  document.body.classList.add('custom-cursor');

  /* ---------- Custom cursor ---------- */
  const cursor = document.getElementById('cursorOrb');
  const trailCanvas = document.getElementById('trailCanvas');
  const tctx = trailCanvas.getContext('2d');
  let tw, th;
  function resizeTrail(){
    tw = trailCanvas.width = window.innerWidth;
    th = trailCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeTrail);
  resizeTrail();

  let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  let pos = { x: mouse.x, y: mouse.y };
  let trail = [];

  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  function animateCursor(){
    const prev = { x: pos.x, y: pos.y };
    pos.x += (mouse.x - pos.x) * 0.18;
    pos.y += (mouse.y - pos.y) * 0.18;

    const dx = pos.x - prev.x, dy = pos.y - prev.y;
    const speed = Math.hypot(dx, dy);
    const stretch = Math.min(1 + speed * 0.05, 2);
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;

    cursor.style.transform =
      `translate3d(${pos.x}px, ${pos.y}px, 0) translate(-50%,-50%) rotate(${angle}deg) scaleX(${stretch}) scaleY(${1 / Math.sqrt(stretch)})`;

    trail.push({ x: pos.x, y: pos.y, life: 1 });
    if(trail.length > 16) trail.shift();

    tctx.clearRect(0, 0, tw, th);
    for(const p of trail){
      p.life *= 0.9;
      const r = 5 * p.life;
      const grad = tctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 3);
      grad.addColorStop(0, `rgba(79,195,255,${0.32 * p.life})`);
      grad.addColorStop(1, 'rgba(79,195,255,0)');
      tctx.fillStyle = grad;
      tctx.beginPath();
      tctx.arc(p.x, p.y, r * 3, 0, Math.PI * 2);
      tctx.fill();
    }

    requestAnimationFrame(animateCursor);
  }
  requestAnimationFrame(animateCursor);

  /* ---------- Magnetic hover ---------- */
  const magnets = document.querySelectorAll('.magnetic');

  window.addEventListener('mousemove', (e) => {
    let hovering = false;
    magnets.forEach((el) => {
      const rect = el.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const dist = Math.hypot(dx, dy);
      const radius = Math.max(rect.width, rect.height) / 2 + 90;

      if(dist < radius){
        hovering = true;
        const pull = (1 - dist / radius) * 16;
        const a = Math.atan2(dy, dx);
        el.style.transform = `translate(${Math.cos(a) * pull}px, ${Math.sin(a) * pull}px)`;
      } else {
        el.style.transform = '';
      }
    });
    cursor.classList.toggle('cursor-grow', hovering);
  });
})();
</script>
</body>
</html>
